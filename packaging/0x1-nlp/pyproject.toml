[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "0x1-nlp"
version = "1.1.0"
description = "0x1NLP: Indonesian natural language preprocessing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Raihan Hidayatullah Djunaedi"}]
dependencies = ["nahiarhdNLP>=1.6.4"]

[project.optional-dependencies]
dev = ["nahiarhdNLP[dev]>=1.6.4"]

[project.urls]
Homepage = "https://github.com/raihan0x1/0x1-nlp"
Documentation = "https://github.com/raihan0x1/0x1-nlp#readme"
Issues = "https://github.com/raihan0x1/0x1-nlp/issues"

[tool.setuptools]
packages = ["ox1nlp"]
